<!doctype html>
<html>
<head><title>idb fixture</title></head>
<body>
<script>
    // A game that keeps its save in IndexedDB and reads it as it boots — the database opened, a few writes, a read,
    // each started when the last one is done, from its first frame: the page's frame each one finished in.
    window.frame = 0;
    window.saved = [];
    function start() {
        var open = indexedDB.open("save", 1);
        open.onupgradeneeded = function () { open.result.createObjectStore("kv"); };
        open.onsuccess = function () {
            window.saved.push(window.frame);
            var db = open.result;
            (function write(i) {
                if (i === 3) {
                    db.transaction("kv").objectStore("kv").get("k0").onsuccess = function () { window.saved.push(window.frame); };
                    return;
                }
                var tx = db.transaction("kv", "readwrite");
                tx.objectStore("kv").put(new Array(20000).join("x") + i, "k" + i);
                tx.oncomplete = function () { window.saved.push(window.frame); write(i + 1); };
            })(0);
        };
    }
    requestAnimationFrame(function tick() {
        window.frame++;
        if (window.frame === 1) { start(); }
        requestAnimationFrame(tick);
    });
</script>
</body>
</html>
